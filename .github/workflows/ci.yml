name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Check Monge in live feed
        run: |
          COUNT=$(curl -L -s https://basmati.com.ua/zoobaza_full.php | grep -io 'monge' | wc -l || true)
          echo "MONGE_COUNT=$COUNT"
