name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Runtime smoke test
        run: |
          set -euo pipefail
          npm start > /tmp/lapka-next.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true; cat /tmp/lapka-next.log' EXIT

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ >/tmp/home.html; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/catalog >/tmp/catalog.html
          curl -fsS http://127.0.0.1:3000/sign-in >/tmp/signin.html
          curl -fsS http://127.0.0.1:3000/checkout >/tmp/checkout.html
          curl -fsS 'http://127.0.0.1:3000/api/catalog?limit=1' >/tmp/catalog.json

          PRODUCT_ID=$(jq -r '.items[0].externalId // empty' /tmp/catalog.json)
          test -n "$PRODUCT_ID"
          curl -fsS "http://127.0.0.1:3000/product/$PRODUCT_ID" >/tmp/product.html

          grep -q 'LAPKA' /tmp/home.html
          grep -q 'Каталог' /tmp/catalog.html
          grep -q 'Код товару' /tmp/product.html
          python - <<'PY'
          from html.parser import HTMLParser
          class VisibleText(HTMLParser):
              def __init__(self):
                  super().__init__(); self.skip=0; self.parts=[]
              def handle_starttag(self, tag, attrs):
                  if tag in ("script","style","noscript"): self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ("script","style","noscript") and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip: self.parts.append(data)
          for name in ("home","catalog","product"):
              p=VisibleText()
              with open(f"/tmp/{name}.html",encoding="utf-8") as fh: p.feed(fh.read())
              visible=" ".join(p.parts).lower()
              assert "zoobaza" not in visible and "зообаза" not in visible, f"supplier name visible on {name}"
          PY

      - name: Check Monge in live feed
        run: |
          COUNT=$(curl -L -s https://basmati.com.ua/zoobaza_full.php | grep -io 'monge' | wc -l || true)
          echo "MONGE_COUNT=$COUNT"
